name: Verify 3 November edition and prepare Brevo DRAFT (NO SEND)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'news-intelligence/2026-11-03/editorial-review-ready.json'

permissions:
  contents: write

concurrency:
  group: prepare-reviewed-2026-11-03-draft
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            news-intelligence/2026-11-03
            reports/daily-intelligence/2026-11-03
            bridge/news-intelligence/latest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source package and prepare identical unsent Brevo draft
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
        run: |
          node --check scripts/prepare-reviewed-2026-11-03-draft.mjs
          node scripts/prepare-reviewed-2026-11-03-draft.mjs
      - name: Commit verified unsent draft receipt and source bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name sapiver-forge-intelligence-bot
          git config user.email actions@users.noreply.github.com
          git add news-intelligence/2026-11-03/newsletter-metadata.json news-intelligence/2026-11-03/draft-verification.json bridge/news-intelligence/latest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify reviewed 3 Nov Brevo draft and source bridge [skip ci] [skip netlify]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          git push origin HEAD:main
      - name: Retain draft verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapiver-forge-reviewed-2026-11-03-draft-${{ github.run_number }}
          path: |
            news-intelligence/2026-11-03/newsletter-metadata.json
            news-intelligence/2026-11-03/draft-verification.json
            news-intelligence/2026-11-03/brevo-readback.html
          if-no-files-found: warn
          retention-days: 14
