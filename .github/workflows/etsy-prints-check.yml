name: SapiverPrints public catalogue refresh

on:
  schedule:
    # Detect new active Etsy listings within approximately 30 minutes; allow slow GitHub checkout.
    # Public feed is refreshed every hour to stay well below Comic's 5.5-hour stale-feed cap.
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-prints-check.yml'

permissions:
  contents: write

concurrency:
  group: sapiverprints-public-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test catalogue change detection before any Etsy API calls
        run: node --test test/etsy-pinterest-handoff.test.mjs
      - name: Verify credentials and check exact SapiverPrints active inventory
        id: etsy
        env:
          ETSY_PRINTS_KEYSTRING: ${{ secrets.ETSY_PRINTS_KEYSTRING }}
          ETSY_PRINTS_SHARED_SECRET: ${{ secrets.ETSY_PRINTS_SHARED_SECRET }}
        run: node scripts/check-etsy-prints.mjs
      - name: Commit validated public products and current ID snapshot
        run: |
          git add data/etsy-active-listing-ids.json data/etsy-public-catalog.json
          if git diff --cached --quiet; then
            echo "No public catalogue changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(shop): refresh sanitized Etsy product feed [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1

      - name: Notify Comic immediately when new published Etsy products are detected
        if: steps.etsy.outputs.pinterest_new_listings == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'Missing existing cross-repo GitHub token; hourly Comic fallback will apply.'; exit 1; }
          node --input-type=module <<'NODE'
          import { dispatchComic } from './lib/cross-repo-dispatch.mjs';
          import { execFileSync } from 'node:child_process';
          const feed_sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const { route } = await dispatchComic({kind:'etsy',inputs:{feed_sha},token:process.env.GH_TOKEN});
          console.log('Etsy product Pin handoff accepted via '+route);
          NODE
          echo "Requested Comic Etsy Pinterest batch for ${{ steps.etsy.outputs.pinterest_new_count }} new active listing(s)."
