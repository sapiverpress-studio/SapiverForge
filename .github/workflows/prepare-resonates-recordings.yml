name: Prepare licensed Sapiver Resonates recordings
on:
  push:
    branches: [publish-sapiver-resonates-20261111]
    paths: ['.github/workflows/prepare-resonates-recordings.yml']
permissions:
  contents: write
jobs:
  recordings:
    if: github.repository == 'sapiverpress-studio/SapiverForge'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install audio tools
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/resonates-audio-tools"
          npm install --prefix "$tools" --no-save --no-package-lock --no-audit --no-fund --ignore-scripts --fetch-retries 1 --fetch-timeout 45000 @ffmpeg-installer/linux-x64@4.1.0
          bin="$tools/node_modules/@ffmpeg-installer/linux-x64"
          chmod u+x "$bin/ffmpeg"
          "$bin/ffmpeg" -version | sed -n '1p'
          echo "$bin" >> "$GITHUB_PATH"
      - name: Download and balance the recorded performances
        run: |
          set -euo pipefail
          mkdir -p originals prepared
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 12 --max-time 70 --user-agent 'SapiverResonates/2.0 (https://suite.sapiverpress.co.uk/sapiver-resonates/)' 'https://upload.wikimedia.org/wikipedia/commons/9/90/The_Tudor_Consort_-_01_-_Palestrina_-_Sicut_lilium_inter_spinas.ogg' --output originals/choir.ogg
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 12 --max-time 70 --user-agent 'SapiverResonates/2.0 (https://suite.sapiverpress.co.uk/sapiver-resonates/)' 'https://upload.wikimedia.org/wikipedia/commons/8/8b/IMSLP173150-PMLP164349-Bach_BWV1007_CelloSuite1_04_darjac.ogg' --output originals/cello.ogg
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 12 --max-time 70 --user-agent 'SapiverResonates/2.0 (https://suite.sapiverpress.co.uk/sapiver-resonates/)' 'https://upload.wikimedia.org/wikipedia/commons/4/42/Goldberg_Variations_01_Aria.ogg' --output originals/piano.ogg
          python3 - <<'PY'
          from array import array
          from math import sqrt, tanh
          from pathlib import Path
          import subprocess
          sources = {
              'choir': ('Sicut lilium inter spinas', 'The Tudor Consort', 'CC BY 3.0', 'https://upload.wikimedia.org/wikipedia/commons/9/90/The_Tudor_Consort_-_01_-_Palestrina_-_Sicut_lilium_inter_spinas.ogg'),
              'piano': ('Goldberg Variations BWV 988: Aria', 'Kimiko Ishizaka', 'CC0 1.0', 'https://upload.wikimedia.org/wikipedia/commons/4/42/Goldberg_Variations_01_Aria.ogg'),
              'cello': ('Cello Suite BWV 1007: Sarabande', 'Darrell Jacobi', 'CC BY 3.0', 'https://upload.wikimedia.org/wikipedia/commons/8/8b/IMSLP173150-PMLP164349-Bach_BWV1007_CelloSuite1_04_darjac.ogg'),
          }
          rate = 32000
          for name, (title, performer, licence, source) in sources.items():
              pcm = subprocess.check_output(['ffmpeg', '-v', 'error', '-i', f'originals/{name}.ogg', '-ar', str(rate), '-ac', '2', '-f', 'f32le', 'pipe:1'])
              samples = array('f', pcm)
              unit = rate // 5 * 2
              levels = [sqrt(sum(x*x for x in samples[i:i+unit]) / unit) for i in range(0, len(samples) - unit + 1, unit)]
              loud = sorted(levels)[int(len(levels)*.8)]
              start = max(0, next(i for i, rms in enumerate(levels) if rms > .13*loud) - 1)
              last = min(start + 370, len(levels) - 2)
              end = min(range(min(start + 275, last), last + 1), key=lambda i: sum(levels[i-2:i+2]) + loud*.12*abs(i-start-330)/55)
              clip = samples[start*unit:end*unit]
              gain = min(.138 / sqrt(sum(x*x for x in clip)/len(clip)), 5)
              for i, value in enumerate(clip):
                  level = value * gain
                  if abs(level) > .55: level = (1 if level >= 0 else -1) * (.55 + .17 * tanh((abs(level) - .55)/.17))
                  clip[i] = level
              output = Path('prepared') / (name + '.mp3')
              note = f'{licence}. Excerpt edited and level-balanced by Sapiver Resonates. Source: {source}'
              subprocess.run(['ffmpeg','-v','error','-f','f32le','-ar',str(rate),'-ac','2','-i','pipe:0','-codec:a','libmp3lame','-b:a','96k','-metadata',f'title={title}','-metadata',f'artist={performer}','-metadata',f'comment={note}',str(output)], input=clip.tobytes(), check=True)
              assert 350000 < output.stat().st_size < 1000000
              print(name, round(len(clip)/rate/2, 2), 'seconds', output.stat().st_size, 'bytes')
          PY
      - name: Store the tracks on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in choir piano cello; do
            NAME="$name" python3 - <<'PY' > request.json
          import base64, json, os
          from pathlib import Path
          name = os.environ['NAME']
          data = base64.b64encode(Path(f'prepared/{name}.mp3').read_bytes()).decode('ascii')
          print(json.dumps({'message': f'Prepare recorded {name} for Sapiver Resonates', 'branch': os.environ['GITHUB_REF_NAME'], 'content': data}))
          PY
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/public/sapiver-resonates/audio/$name.mp3" --input request.json --jq '.content.sha'
          done
