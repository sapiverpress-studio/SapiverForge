name: One-off validated SapiverPrints catalogue deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-deploy-etsy-catalogue.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Gate on fresh real Etsy catalogue and last approved news release
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {PUBLIC_ETSY_FEED_URL,validatePublicEtsyFeed} from './lib/etsy-public-feed.mjs';
          const site=JSON.parse(fs.readFileSync('news-intelligence/2026-10-13/site-release.json','utf8'));
          const released=JSON.parse(fs.readFileSync('news-intelligence/2026-10-13/netlify-release.json','utf8'));
          const editions=JSON.parse(fs.readFileSync('public/daily-brief/intelligence/editions.json','utf8'));
          if(released.status!=='deployed'||site.candidate_id!==released.candidate_id||editions[0]?.candidate_id!==site.candidate_id)throw Error('Unapproved Daily Brief change: deployment blocked.');
          const response=await fetch(PUBLIC_ETSY_FEED_URL,{signal:AbortSignal.timeout(18000)});
          if(!response.ok)throw Error('Public catalogue source HTTP '+response.status);
          const feed=validatePublicEtsyFeed(await response.json());
          if(feed.items.length<20)throw Error('Incomplete Etsy feed');
          console.log('Preflight passed: '+feed.items.length+' fresh Etsy listings and protected approved news edition.');
          NODE

      - name: Build and test the COMPLETE established Sapiver Press suite
        env:
          BLOG_BASE_URL: https://suite.sapiverpress.co.uk
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node src/build-site.mjs
          node src/build-puzzles.mjs
          node scripts/inject-news-intelligence-site.mjs
          node test/puzzle-site-contract.mjs
          node test/shop-page-contract.mjs
          node test/etsy-prints-contract.mjs
          for p in public/index.html public/shop/index.html public/podcast/index.html public/parents/index.html public/daily-brief/index.html public/puzzles/index.html public/daily-brief/intelligence/2026-10-13/index.html; do
            test -s "$p"
          done
          test -s public/podcast/feed.xml
          grep -q 'etsy-live' public/shop/index.html
          echo 'The complete site passed tests; no unapproved daily news was regenerated.'

      - name: Deploy the complete site ONCE
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 47bda30e-4698-4cf5-bcd4-d59785e1f399
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          npx --yes netlify-cli@27.5.2 deploy --prod --no-build \
            --dir=public --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Restore Etsy poster catalogue using secret-free GitHub feed"

      - name: Verify published catalogue endpoint
        run: |
          node --input-type=module <<'NODE'
          for(let i=0;i<9;i++){
            try{
              const r=await fetch('https://suite.sapiverpress.co.uk/api/etsy-prints',{signal:AbortSignal.timeout(18000)});
              if(!r.ok)throw Error('HTTP '+r.status);
              const feed=await r.json();
              if(feed.shop!=='SapiverPrints'||!Array.isArray(feed.items)||feed.items.length<20)throw Error('Wrong shop or incomplete live inventory');
              const page=await fetch('https://suite.sapiverpress.co.uk/shop/');
              if(!page.ok||!(await page.text()).includes('etsy-live'))throw Error('Shop page missing');
              console.log('Verified '+feed.items.length+' live SapiverPrints products and existing shop page.');
              process.exit(0);
            }catch(e){console.log('Verification attempt '+(i+1)+': '+String(e.message));await new Promise(r=>setTimeout(r,6000));}
          }
          throw Error('Post-deployment public catalogue verification failed');
          NODE
