name: Deploy Private Daily Intelligence Runner

on:
  push:
    branches: [main]
    paths:
      - 'private-runner/**'
      - 'test/daily-brief-runner-contract.mjs'
      - '.github/workflows/install-daily-brief-runner.yml'
      - 'public/daily-brief/runner/**'
      - 'netlify/functions/daily-brief-runner.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sapiver-private-runner
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check private runner and security tests
        run: |
          node --check private-runner/netlify/functions/daily-brief-runner.mjs
          node test/daily-brief-runner-contract.mjs
          node --check scripts/import-reviewed-daily-brief-zip.mjs
          node --check scripts/verify-reviewed-daily-brief-brevo.mjs
          node test/reviewed-brief-zip-contract.mjs
          test -s private-runner/public/index.html
          test ! -e public/daily-brief/runner/index.html
          test ! -e netlify/functions/daily-brief-runner.mjs
      - name: Restore last published public suite snapshot WITHOUT runner (migration only)
        if: github.event_name == 'push' && github.event.head_commit.message == 'Relocate Daily Intelligence runner off public site'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}"
          git clone --no-checkout --depth 1 https://github.com/sapiverpress-studio/SapiverForge.git previous-live
          cd previous-live
          git fetch --depth=1 origin 290ffaec03e3151e8a0ea9e1c3a32fc21528be4d
          git checkout --detach 290ffaec03e3151e8a0ea9e1c3a32fc21528be4d
          test -s public/daily-brief/runner/index.html
          rm -rf public/daily-brief/runner
          rm -f netlify/functions/daily-brief-runner.mjs
          test ! -e public/daily-brief/runner/index.html
          test ! -e netlify/functions/daily-brief-runner.mjs
          npm ci --no-audit --no-fund
          npx --yes netlify-cli@27.5.2 deploy \
            --prod --no-build --dir=public --functions=netlify/functions \
            --site=47bda30e-4698-4cf5-bcd4-d59785e1f399 \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Remove internal runner from public suite (no editorial release)"
      - name: Deploy isolated runner to its OWN Netlify project
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}"
          npx --yes netlify-cli@27.5.2 deploy \
            --prod --no-build \
            --dir=private-runner/public \
            --functions=private-runner/netlify/functions \
            --site=7461afca-61ae-4221-8495-b2e0d02e43fc \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Deploy protected standalone Daily Intelligence runner"
