name: Import Hen & Bea companion into existing Sapiver website
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PILOT to import the exact reviewed Christmas edition privately
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hen-bea-companion-pilot.yml'
permissions:
  contents: read
concurrency:
  group: hen-bea-companion-pilot
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'sapiverpress-studio/SapiverForge' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm == 'PILOT')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Import exact companion into site-wide private storage, no deployment
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          node --check scripts/import-companion-suite.mjs
          python3 -m py_compile scripts/package-companion-suite.py
          node scripts/import-companion-suite.mjs
