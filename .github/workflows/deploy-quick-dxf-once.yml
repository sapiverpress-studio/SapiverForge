name: Deploy Quick DXF production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-quick-dxf-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_SITE_ID: '548a519d-04f8-4d5b-9b0d-13e2d5d0206d'
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Check out Quick DXF main
        uses: actions/checkout@v4
        with:
          repository: sapiverpress-studio/Sapiver-draw-dxf
          ref: main
          path: quick-dxf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deploy credential
        shell: bash
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'NETLIFY_AUTH_TOKEN is missing'; exit 1; }

      - name: Install Quick DXF dependencies
        working-directory: quick-dxf
        run: npm install --omit=dev --no-audit --no-fund

      - name: Run Quick DXF checks
        working-directory: quick-dxf
        shell: bash
        run: |
          node --check app-v4.js
          node --check core/dxf.js
          node --check core/geometry.js
          node --check core/confirmation-pdf.js
          for file in netlify/functions/*.mjs; do node --check "$file"; done
          node tests/geometry.test.mjs
          node tests/ui-contract.test.mjs

      - name: Build publish directory
        working-directory: quick-dxf
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/core
          cp index.html styles.css job.css job-v4.css app-v4.js _site/
          cp core/*.js _site/core/

      - name: Deploy Quick DXF to production
        working-directory: quick-dxf
        shell: bash
        run: |
          npx -y netlify-cli@latest deploy \
            --prod \
            --dir=_site \
            --functions=netlify/functions \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Quick DXF v1 production"
