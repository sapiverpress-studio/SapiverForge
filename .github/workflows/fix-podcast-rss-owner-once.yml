name: Fix Podcast RSS Owner Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-podcast-rss-owner-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update podcast owner and canonical feed URLs
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('scripts/publish-podcast-feed.mjs'): [
                  ('clearforge@sapiverpress.co.uk', 'support@sapiverpress.co.uk'),
                  ('const SAPIVER_FORGE_BASE = "https://sapiverforge-daily-brief.netlify.app";', 'const SAPIVER_FORGE_BASE = "https://suite.sapiverpress.co.uk";'),
              ],
              Path('public/podcast/feed.xml'): [
                  ('clearforge@sapiverpress.co.uk', 'support@sapiverpress.co.uk'),
              ],
              Path('PODCAST_RSS_SETUP.md'): [
                  ('https://sapiverforge-daily-brief.netlify.app/podcast/feed.xml', 'https://suite.sapiverpress.co.uk/podcast/feed.xml'),
                  ('https://sapiverforge-daily-brief.netlify.app/podcast/', 'https://suite.sapiverpress.co.uk/podcast/'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'Expected podcast RSS replacement did not change {path}')
              path.write_text(text)
          PY
      - name: Validate RSS
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse('public/podcast/feed.xml')
          feed = Path('public/podcast/feed.xml').read_text()
          generator = Path('scripts/publish-podcast-feed.mjs').read_text()
          setup = Path('PODCAST_RSS_SETUP.md').read_text()
          assert '<itunes:email>support@sapiverpress.co.uk</itunes:email>' in feed
          assert '<managingEditor>support@sapiverpress.co.uk (Sapiver Forge)</managingEditor>' in feed
          assert 'clearforge@sapiverpress.co.uk' not in feed
          assert 'support@sapiverpress.co.uk' in generator
          assert 'const SAPIVER_FORGE_BASE = "https://suite.sapiverpress.co.uk";' in generator
          assert 'https://suite.sapiverpress.co.uk/podcast/feed.xml' in setup
          print('Podcast RSS owner and canonical URL validation passed.')
          PY
      - name: Commit RSS correction
        run: |
          set -euo pipefail
          git config user.name 'sapiverpress-studio'
          git config user.email 'sapiverpress@gmail.com'
          git add scripts/publish-podcast-feed.mjs public/podcast/feed.xml PODCAST_RSS_SETUP.md
          git commit -m 'Use support email for podcast RSS ownership [skip ci]'
          git push origin HEAD:main
