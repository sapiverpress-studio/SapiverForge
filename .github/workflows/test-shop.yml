name: Test Shop page
on:
  pull_request:
    paths:
      - 'data/shop-products.json'
      - 'scripts/build-shop-page.mjs'
      - 'scripts/apply-trust-first-site.mjs'
      - 'test/shop-page-contract.mjs'
      - '.github/workflows/test-shop.yml'
  workflow_dispatch:
jobs:
  shop-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate Shop with existing static site builder
        run: node scripts/apply-trust-first-site.mjs
      - name: Validate retailer links and published products
        run: node test/shop-page-contract.mjs
