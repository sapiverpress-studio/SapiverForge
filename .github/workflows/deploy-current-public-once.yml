name: Deploy Current SapiverForge Public Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-current-public-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify 2026-09-15 podcast assets
        run: |
          set -euo pipefail
          test -s public/podcast/episodes/2026-09-15-daily-intelligence.html
          test -s public/podcast/episodes/2026-09-15-daily-intelligence.mp3
          test -s public/podcast/episodes/2026-09-15-daily-intelligence.mp4
          grep -q '2026-09-15-daily-intelligence' public/podcast/episodes.json
          grep -q '2026-09-15-daily-intelligence' public/podcast/feed.xml
      - name: Deploy current public directory to production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 47bda30e-4698-4cf5-bcd4-d59785e1f399
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          npx --yes netlify-cli@latest deploy \
            --prod \
            --no-build \
            --dir=public \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Publish 2026-09-15 Daily Brief podcast"
