[build]
  command = "node src/build-site.mjs && node src/build-puzzles.mjs && node scripts/apply-trust-first-site.mjs && node test/puzzle-site-contract.mjs"
  publish = "public"
  functions = "netlify/functions"
  # Repository pushes should only update GitHub. Production is released explicitly
  # by the manual Netlify CLI deployment workflow.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/puzzle-source/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
