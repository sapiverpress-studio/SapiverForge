name: Test Shop page
on:
  pull_request:
    paths:
      - 'data/shop-products.json'
      - 'scripts/build-shop-page.mjs'
      - 'scripts/apply-trust-first-site.mjs'
      - 'test/shop-page-contract.mjs'
      - 'test/etsy-prints-contract.mjs'
      - 'lib/etsy-prints.mjs'
      - 'netlify/functions/etsy-prints.mjs'
      - 'scripts/etsy-prints-client.js'
      - '.github/workflows/etsy-prints-check.yml'
      - '.github/workflows/test-shop.yml'
  workflow_dispatch:
jobs:
  shop-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/shop-products.json
            scripts/apply-trust-first-site.mjs
            scripts/build-shop-page.mjs
            scripts/etsy-prints-client.js
            lib/etsy-prints.mjs
            netlify/functions/etsy-prints.mjs
            test/etsy-prints-contract.mjs
            test/shop-page-contract.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate Shop with existing static site builder
        run: mkdir -p public && node scripts/apply-trust-first-site.mjs
      - name: Validate retailer links and published products
        run: node test/shop-page-contract.mjs
      - name: Test Etsy API read-only logic and Netlify responses
        run: node test/etsy-prints-contract.mjs
