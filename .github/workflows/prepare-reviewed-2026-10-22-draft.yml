name: Verify 22 October Daily Brief and sync Brevo draft (NO SEND)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'news-intelligence/2026-10-22/editorial-review-ready.json'

permissions:
  contents: write

concurrency:
  group: reviewed-2026-10-22-newsletter
  cancel-in-progress: false

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check revised editorial sources and release metadata
        shell: bash
        run: |
          set -euo pipefail
          node --check src/send-daily-newsletter-brevo.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='news-intelligence/2026-10-22/';
          const manifest=JSON.parse(fs.readFileSync(root+'manifest.json','utf8'));
          const meta=JSON.parse(fs.readFileSync(root+'newsletter-metadata.json','utf8'));
          const html=fs.readFileSync(root+'newsletter.html','utf8');
          const md=fs.readFileSync(root+'newsletter.md','utf8');
          const speech=fs.readFileSync('reports/daily-intelligence/2026-10-22/COPY_PASTE_INTO_ELEVENLABS.txt','utf8');
          const podcast=fs.readFileSync('reports/daily-intelligence/2026-10-22/podcast-script.md','utf8');
          const normalise=s=>s.replaceAll('&#039;',"'").replaceAll('&quot;','"').replaceAll('&amp;','&');
          if(manifest.date!=='2026-10-22'||manifest.editorial_revision!=='2026-10-22-review-1'||manifest.stories.length!==4||!manifest.newsletter_ready_for_human_approval)throw Error('Unreviewed or incomplete edition');
          if(meta.status!=='brevo_draft'||meta.brevo_campaign_id!==99||meta.sent_at!==null||meta.approved!==false||meta.candidate_id!==manifest.candidate_id)throw Error('Expected original, unsent Brevo campaign 99');
          const h=normalise(html);
          for(const phrase of [
            'an appeal does not by itself establish that the judgment has been stayed',
            'Railway advised all customers',
            'standard returns process applies',
            '8.2.35, 8.3.36, 8.4.27 or 8.5.12'
          ]) if(!h.toLowerCase().includes(phrase.toLowerCase()))throw Error('Email missing correction: '+phrase);
          for(const bad of [
            'does not could support refunds',
            'payout is currently on hold',
            'currently suspended by the appeal process',
            'lack of liability for AI',
            '£25 billion',
            '£25bn',
            'Meta\'s Twenty-Five Billion Pound Problem'
          ]) if(h.includes(bad)||md.includes(bad)||speech.includes(bad)||podcast.includes(bad))throw Error('Outdated claim: '+bad);
          if(!podcast.includes('US-dollar judgment')||!speech.includes('twenty-five billion US dollars'))throw Error('Narration does not distinguish US dollars');
          console.log('22 October source texts checked and original Brevo 99 is unsent.');
          NODE

      - name: Update existing Brevo 99 draft via API
        env:
          NEWS_INTELLIGENCE_DATE: '2026-10-22'
          BREVO_SEND_MODE: draft
          NEWSLETTER_APPROVED: 'false'
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
        run: node src/send-daily-newsletter-brevo.mjs

      - name: Verify actual Brevo 99 content, status and sender
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const dir='news-intelligence/2026-10-22/';
          const meta=JSON.parse(fs.readFileSync(dir+'newsletter-metadata.json','utf8'));
          const response=await fetch('https://api.brevo.com/v3/emailCampaigns/99',{headers:{'api-key':process.env.BREVO_API_KEY,accept:'application/json'}});
          if(!response.ok)throw Error('Brevo readback failed '+response.status);
          const remote=await response.json();
          if(Number(remote.id)!==99||remote.status!=='draft')throw Error('Brevo 99 is not an unsent draft');
          const local=fs.readFileSync(dir+'newsletter.html','utf8');
          const normalise=s=>String(s).replaceAll('&#039;',"'").replaceAll('&quot;','"').replaceAll('&amp;','&');
          const html=normalise(remote.htmlContent);
          for(const phrase of [
            'standard returns process applies',
            'an appeal does not by itself establish that the judgment has been stayed',
            'Railway advised all customers',
            '8.2.35, 8.3.36, 8.4.27 or 8.5.12'
          ]) if(!html.toLowerCase().includes(phrase.toLowerCase()))throw Error('Brevo lacks corrected phrase '+phrase);
          if(html.includes('does not could support refunds')||html.includes('payout is currently on hold'))throw Error('Brevo content is stale');
          if(normalise(local)!==html)throw Error('Brevo HTML differs from reviewed repository newsletter');
          Object.assign(meta,{
            draft_editorial_revision:'2026-10-22-review-1',
            brevo_content_verified:true,
            brevo_verified_at:new Date().toISOString(),
            brevo_verified_content_sha256:createHash('sha256').update(local).digest('hex')
          });
          fs.writeFileSync(dir+'newsletter-metadata.json',JSON.stringify(meta,null,2)+'\n');
          console.log('Brevo campaign 99 is a verified, corrected DRAFT. Nothing sent.');
          NODE

      - name: Synchronise corrected bridge and podcast integrity hashes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const src='news-intelligence/2026-10-22/';
          const bridge='bridge/news-intelligence/latest/';
          const files=['manifest.json','daily-brief.md','newsletter.html','newsletter-metadata.json','social.json','sources.json','human-review.html'];
          fs.mkdirSync(bridge,{recursive:true});
          const hashes={};
          for(const name of files){const content=fs.readFileSync(src+name);fs.writeFileSync(bridge+name,content);hashes[name]=createHash('sha256').update(content).digest('hex');}
          fs.writeFileSync(bridge+'file-hashes.json',JSON.stringify(hashes,null,2)+'\n');
          const dir='reports/daily-intelligence/2026-10-22/';
          const p=dir+'candidate-manifest.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          for(const name of Object.keys(j.file_hashes||{}))j.file_hashes[name]=createHash('sha256').update(fs.readFileSync(dir+name)).digest('hex');
          j.editorial_revision='2026-10-22-review-1';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          console.log('Bridge and podcast hash manifest updated.');
          NODE

      - name: Commit Brevo readback and source bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name sapiver-forge-intelligence-bot
          git config user.email actions@users.noreply.github.com
          git add news-intelligence/2026-10-22/newsletter-metadata.json bridge/news-intelligence/latest reports/daily-intelligence/2026-10-22/candidate-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify Brevo 99 and sync 22 October edition [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          git push origin HEAD:main
